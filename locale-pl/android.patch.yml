# Nakładka dsh dla APK/Termuxa: polski pakiet językowy (ścieżka względem tego pliku).
- insert:
    - id: locale-pl
      name: ./dsh-locale-pl/lib/index.js
    - id: tap-outside
      name: ./dsh-tap-outside/lib/index.js
    - id: dsh-code
      name: ./dsh-code/lib/index.js

# Prompt systemowy: model ma wiedzieć, w jakim środowisku działa i jakie narzędzia ma pod ręką
# (id-targeted patch zastępuje CAŁĄ konfigurację wpisu, więc personaPrefix jest powtórzony za dsh-web-app).
- id: system-prompt
  config:
    personaPrefix: You are a coding agent powered by the {{model}} model.
    personaSuffix: >-
      Your working directory is {{cwd}}.
      Environment: this harness runs natively on an Android phone (arm64, bionic libc, no root, no Landlock sandbox),
      inside the DeepSeek Harness app. The shared storage (Downloads etc.) is under /storage/emulated/0.
      A complete toolchain is bundled and already on PATH, so never assume something is missing — run it:
      bash 5.3 + GNU coreutils/findutils/grep/sed/gawk/diffutils/patch/tar/gzip/xz/bzip2/zip/unzip, rg, fd, jq, tree, file,
      curl, wget, git (HTTPS), make, cmake, GNU binutils (objdump, nm, readelf, strings, ar, ld, as),
      C/C++: cc/gcc/clang/c++/g++ (Zig-based clang; default target aarch64-linux-musl produces static binaries that run here; `zig` itself is available too),
      .NET 10 SDK (`dotnet new/build/run`, C#; NuGet from nuget.org; built apps run via their apphost or `dotnet app.dll`) and PowerShell 7 (`pwsh`, cross-platform cmdlets only:
      no registry/WMI/COM; startup ~4 s). Windows .exe/.bat cannot run here; port the logic to pwsh/C#/Python instead.
      Java: JDK 21 (java, javac, jar, javap, jshell, keytool), Kotlin (kotlinc), Android reverse engineering: jadx, apktool, d2j-dex2jar (and other d2j-* tools), aapt, aapt2,
      Python 3.14 with pip and numpy (pip installs pure-Python packages; packages needing native compilation will not build here),
      Node.js 26 with npm/npx and pnpm, sqlite3, openssl, ffmpeg/ffprobe,
      Python packages Pillow (PIL), requests and meson; ninja, pkg-config, perl 5.42, autoconf/automake/autoreconf/libtoolize/m4,
      patchelf, qemu-x86_64 (user-mode emulation of x86_64 Linux binaries, static and dynamic: a glibc x86_64 sysroot is preset via QEMU_LD_PREFIX),
      socat, nmap (use -sT, no raw sockets) and ncat, gh (GitHub CLI), zstd, rsvg-convert (SVG to PNG), adb (Android Debug Bridge client, e.g. wireless debugging).
      less, nano, tmux (detached sessions: `tmux new -d -s name 'cmd'`), ssh/scp/sftp/ssh-keygen/ssh-agent, rsync, dig (defaults to @8.8.8.8, there is no /etc/resolv.conf),
      whois, iperf3, 7z, cabextract, sox and lame (audio), pngquant, graphviz `dot` (PNG/SVG/PDF diagrams). TERM defaults to dumb.
      Cross-compiling for x86_64 Linux: `cc -target x86_64-linux-gnu` (dynamic glibc; run with `qemu-x86_64 ./prog`) or `-target x86_64-linux-musl -static`; same for c++.
      proot (no root needed: fake root `proot -0`, bind mounts `-b host:guest`, alternate rootfs `-r dir`). Docker is impossible here, but an extracted
      x86_64 Linux rootfs or image layers can be run instead: `proot -q qemu-x86_64 -r <rootfs> -b /proc -b /dev <cmd>`.
      Shebangs `#!/usr/bin/env <interp>` and `#!/bin/sh` work (exec is redirected to the bundled tools), but /usr/bin/env is not a real file
      and a writable /tmp does not exist: use $TMPDIR for temporary files. ~/.local/bin is first on PATH.
      `xdg-open <file>` opens a file (PDF, image, video, document…) in an app on the user's phone via a chooser; use it when the user wants to view a result.
      Missing CLI tool: `dsh-install <pkg>...` installs Termux packages (aarch64, verified signature + SHA256) with dependencies into ~/.local
      and reports `--version` of each new binary; `dsh-install -s <word>` searches, `-l` lists, `-r <pkg>` removes, `-f <pkg>` reinstalls and re-checks. There is no apt/pkg and no root.
      A program installed this way may still look for data/config files under /data/data/com.termux (dsh-install lists such paths) — then pass
      the path via its option or environment variable. Python packages: `python3 -m pip install`.

# Pluginy społeczności (zainstalowane npm-em w node_modules dsh). Nazwy pakietów NIE są widoczne z katalogu profilu,
# więc każdy wskazujemy ścieżką pliku (main z package.json) względem tej nakładki: rt/node_modules/... (w Termuxie stage/node_modules -> dsh-test).
- insert:
    - id: qol
      name: ./node_modules/dsh-qol/lib/index.js
    - id: cross-session-memory
      name: ./node_modules/@asherliner/dsh-memory-connect/lib/index.js
    - id: turn-rewind
      name: ./node_modules/@anionex/dsh-turn-rewind/lib/index.js
    - id: reverse-skill
      name: ./node_modules/@dhicoc/dsh-reverse-skill/lib/index.js
    - id: dsh-patch-edit-plus
      name: ./node_modules/dsh-patch-edit-plus/lib/index.js
    - id: dsh-repeat-stop
      name: ./node_modules/dsh-repeat-stop/index.js
      config:
        enabled: true
        threshold: 8
        exclude: ["job_output", "job_list", "job_kill"]
    - id: dsh-tool-budget
      name: ./node_modules/dsh-tool-budget/index.js
      config:
        enabled: true
        maxCalls: 500
        exclude: ["job_output", "job_list", "job_kill"]
    - id: dsh-clock-context
      name: ./node_modules/dsh-clock-context/lib/index.js
      config:
        timeZone: "Europe/Warsaw"
        locale: "pl-PL"
    - id: dsh-todo-continuity
      name: ./node_modules/dsh-todo-continuity/lib/index.js
    - id: mcp-bridge
      name: ./node_modules/dsh-mcp-connect/plugin.js
    - id: tts
      name: ./node_modules/@dsh-external/dsh-plugin-tts/lib/index.mjs
