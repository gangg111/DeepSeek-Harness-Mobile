<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Treść .md nie może uruchamiać skryptów (mostek Md czyta i zapisuje otwarty plik): tylko nasze pliki, zero sieci. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<header>
  <div id="name"></div>
  <div class="tabs">
    <button id="tab-view" class="on">Podgląd</button>
    <button id="tab-edit">Edycja</button>
  </div>
  <button id="save" hidden>Zapisz</button>
  <!-- Kopiowanie całego dokumentu (źródło markdown): kontur = niewciśnięta, wypełniona = wciśnięta/skopiowano. -->
  <button id="copy" title="Kopiuj dokument (markdown)" aria-label="Kopiuj dokument">
    <svg class="off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></svg>
    <svg class="on" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path fill="none" d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></svg>
  </button>
  <button id="ext" title="Otwórz w innej aplikacji">⋮</button>
</header>
<main id="view"></main>
<textarea id="edit" hidden spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
<div id="toast" hidden></div>
<script src="marked.umd.js"></script>
<script src="viewer.js"></script>
</body>
</html>
